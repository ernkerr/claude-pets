<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="styles.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<script src="node_modules/marked/lib/marked.umd.js"></script>
<script src="node_modules/dompurify/dist/purify.min.js"></script>
</head>
<body>
  <div id="dog"><img id="dog-img" src="assets/default-pet.png" /></div>
  <div id="status-pill">idle</div>

  <div id="bubble">
    <!-- Permission section (overrides everything else when active) -->
    <div id="permission-section" class="section">
      <div id="title"></div>
      <pre id="content"></pre>
      <div id="summary"></div>
      <button id="diff-toggle" class="link-btn">Show Diff</button>
      <div id="diff-view"></div>
      <div id="prompt-line">Do you want to proceed?</div>
      <div id="options"></div>
      <div id="deny-form">
        <textarea id="deny-feedback" rows="3" placeholder="Tell Claude what to do differently (optional)"></textarea>
        <div class="deny-row">
          <button id="deny-back">Back</button>
          <button class="send" id="deny-send">Send</button>
        </div>
      </div>
      <div id="queue-hint"></div>
    </div>

    <!-- Message section (Claude said something) -->
    <div id="message-section" class="section">
      <div id="msg-text"></div>
      <button id="expand-btn" class="link-btn">expand</button>
    </div>

    <!-- Input section (always at the bottom) -->
    <div id="input-section" class="section">
      <textarea id="reply-input" rows="2" placeholder="ask Claude&#x2026;"></textarea>
      <div class="input-row">
        <button id="send-btn">Send</button>
      </div>
    </div>

    <!-- Settings disclosure -->
    <div id="settings-bar">
      <button id="settings-toggle" title="settings"><i data-lucide="settings"></i></button>
    </div>
    <div id="settings-panel">
      <div class="icon-row">
        <button id="btn-upload">Change icon</button>
        <button id="btn-reset">Use default</button>
      </div>
      <label class="toggle-row">
        <input type="checkbox" id="pill-verbose" />
        Thinking out loud
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="pill-playful" checked />
        Playful status
      </label>
      <div id="icon-error"></div>
      <button id="btn-exit" class="exit-btn">Exit this pet</button>
    </div>
  </div>

  <script type="module" src="renderer.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
