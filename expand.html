<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<script src="node_modules/marked/lib/marked.umd.js"></script>
<script src="node_modules/dompurify/dist/purify.min.js"></script>
<style>
  body {
    margin: 0;
    padding: 16px 20px;
    font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
    font-size: 13px;
    line-height: 1.55;
    color: #2c2a26;
    background: #faf9f6;
    word-break: break-word;
  }
  #content > *:first-child { margin-top: 0; }
  #content > *:last-child { margin-bottom: 0; }
  #content p { margin: 0 0 8px; }
  #content h1, #content h2, #content h3,
  #content h4, #content h5, #content h6 {
    font-size: 14px;
    font-weight: 600;
    margin: 12px 0 6px;
  }
  #content ul, #content ol { margin: 0 0 8px; padding-left: 20px; }
  #content li { margin: 0; }
  #content code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    background: rgba(127,127,127,0.14);
    padding: 1px 4px;
    border-radius: 3px;
  }
  #content pre {
    margin: 0 0 8px;
    padding: 10px 12px;
    background: rgba(127,127,127,0.10);
    border-radius: 5px;
    overflow-x: auto;
    white-space: pre;
  }
  #content pre code { background: none; padding: 0; font-size: 12px; }
  #content a { color: #2c2a26; text-decoration: underline; }
  #content blockquote {
    margin: 0 0 8px;
    padding-left: 10px;
    border-left: 3px solid #d4d0c8;
    color: #7a766b;
  }
</style>
</head>
<body>
  <div id="content"></div>
  <script type="module" src="expand-renderer.js"></script>
</body>
</html>
